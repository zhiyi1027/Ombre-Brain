    <rect x="192" y="614" width="67" height="36" rx="15" fill="#FBF8F1" stroke="#DED5C8"/>
    <text x="225.5" y="637" text-anchor="middle" class="muted" font-size="11">计划</text>
    <rect x="266" y="614" width="67" height="36" rx="15" fill="#FBF8F1" stroke="#DED5C8"/>
    <text x="299.5" y="637" text-anchor="middle" class="muted" font-size="11">信</text>
    <rect x="340" y="614" width="70" height="36" rx="15" fill="#FBF8F1" stroke="#DED5C8"/>
    <text x="375" y="637" text-anchor="middle" class="muted" font-size="11">更多 ·</text>
  </g>

  <!-- Action needed -->
  <g filter="url(#tiny)">
    <rect x="20" y="678" width="390" height="84" rx="20" fill="#FCF8EB" stroke="#DEC98D"/>
  </g>
  <rect x="20" y="678" width="4" height="84" rx="2" fill="#C6A35C"/>
