  </g>
  <circle cx="382" cy="190" r="8" stroke="#756F66" stroke-width="1.7"/>
  <path d="M388 196L394 202" stroke="#756F66" stroke-width="1.7" stroke-linecap="round"/>
  <text x="38" y="195" class="ui faint" font-size="13">找找那个让我停下来的瞬间…</text>

