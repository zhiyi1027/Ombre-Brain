    <rect x="20" y="825" width="390" height="92" rx="20" fill="#FBF8F1" stroke="#E1D8CB"/>
    <circle cx="42" cy="851" r="5" fill="#72947D"/>
    <text x="56" y="855" class="ui ink" font-size="13" font-weight="600">小螃蟹终于变可爱了</text>
