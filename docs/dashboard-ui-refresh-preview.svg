    <text x="167" y="521" text-anchor="middle" class="mono ink" font-size="15" font-weight="700">150</text>
    <text x="167" y="543" text-anchor="middle" class="ui muted" font-size="10">感受</text>
    <text x="265" y="521" text-anchor="middle" class="mono ink" font-size="15" font-weight="700">233</text>
