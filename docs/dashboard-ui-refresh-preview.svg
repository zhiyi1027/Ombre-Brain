  <text x="37" y="338" class="ui muted" font-size="12.5">核心、昨日印象、最近发生的事，</text>
  <text x="37" y="360" class="ui muted" font-size="12.5">还有偶尔自己浮上来的一点旧记忆。</text>
  <rect x="37" y="384" width="122" height="34" rx="17" fill="#D87358"/>
  <text x="98" y="405" text-anchor="middle" class="ui" fill="#FFFDF9" font-size="12" font-weight="600">看看会想起什么</text>
  <text x="390" y="407" text-anchor="end" class="mono faint" font-size="8.5">ABOUT 3.2K TOKENS</text>

