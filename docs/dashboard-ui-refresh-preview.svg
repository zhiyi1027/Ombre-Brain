    <rect x="36" y="11" width="7" height="6" fill="#DE886D"/>
    <rect x="5" y="4" width="6" height="7" fill="#DE886D"/>
    <rect x="34" y="4" width="6" height="7" fill="#DE886D"/>
    <rect x="14" y="14" width="3" height="5" fill="#2B2926"/>
