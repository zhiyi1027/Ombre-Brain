<svg width="430" height="1180" viewBox="0 0 430 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="18" y1="0" x2="412" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F3EB"/>
      <stop offset="1" stop-color="#EEE8DE"/>
    </linearGradient>
    <linearGradient id="hero" x1="28" y1="226" x2="402" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6E9E1"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#6F6254" flood-opacity="0.10"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#6F6254" flood-opacity="0.09"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.45" fill="#776C61" opacity="0.08"/>
    </pattern>
    <style>
      .ui { font-family: "RRPL"; }
      .mono { font-family: "DejaVu Sans Mono"; letter-spacing: 0.08em; }
      .serif { font-family: "RRPL"; }
      .ink { fill: #2B2926; }
      .muted { fill: #756F66; }
      .faint { fill: #A09990; }
    </style>
  </defs>

  <rect width="430" height="1180" fill="url(#page)"/>
  <rect width="430" height="1180" fill="url(#grain)" opacity="0.55"/>

  <!-- Compact mobile header -->
  <g class="ui">
