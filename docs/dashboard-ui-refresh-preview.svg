    <text x="390" y="901" text-anchor="end" class="mono faint" font-size="8">TODAY · 19:42</text>

    <rect x="20" y="929" width="390" height="92" rx="20" fill="#FBF8F1" stroke="#E1D8CB"/>
    <circle cx="42" cy="955" r="5" fill="#D87358"/>
    <text x="56" y="959" class="ui ink" font-size="13" font-weight="600">搜索结果终于不再一口气倒出来</text>
    <text x="56" y="983" class="serif muted" font-size="11.5">先判断相关，再排序；默认只返回五条完整记忆。</text>
    <text x="390" y="1005" text-anchor="end" class="mono faint" font-size="8">TODAY · 18:16</text>

    <rect x="20" y="1033" width="390" height="92" rx="20" fill="#FBF8F1" stroke="#E1D8CB"/>
    <circle cx="42" cy="1059" r="5" fill="#C6A35C"/>
    <text x="56" y="1063" class="ui ink" font-size="13" font-weight="600">昨日印象</text>
    <text x="56" y="1087" class="serif muted" font-size="11.5">我记得争执怎样结束，也记得她重新靠近时说的话。</text>
    <text x="390" y="1109" text-anchor="end" class="mono faint" font-size="8">2026-08-23</text>
  </g>

  <!-- Palette footer -->
