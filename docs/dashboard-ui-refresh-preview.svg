    <circle cx="24" cy="124" r="4.5" fill="#72947D"/>
    <text x="36" y="128" class="ui muted" font-size="12">在线 · 衰减运行中</text>
    <text x="397" y="128" text-anchor="end" class="mono muted" font-size="10">3 / 24 ANCHORS</text>
