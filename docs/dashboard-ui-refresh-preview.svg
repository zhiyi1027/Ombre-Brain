    <text x="68" y="43" class="mono ink" font-size="17" font-weight="700">OMBRE</text>
    <text x="68" y="58" class="mono faint" font-size="8">PERSONAL MEMORY</text>

    <rect x="276" y="27" width="64" height="31" rx="15.5" fill="#FFFDF8" stroke="#DED6C9"/>
    <text x="308" y="47" text-anchor="middle" class="ui muted" font-size="12">反馈</text>
    <rect x="348" y="27" width="62" height="31" rx="15.5" fill="#F9EAE5" stroke="#E5B3A5"/>
    <circle cx="363" cy="42.5" r="3.5" fill="#D87358"/>
    <text x="386" y="47" text-anchor="middle" class="ui" fill="#A64F3C" font-size="12">重启</text>
  </g>

  <!-- Title and status -->
  <g class="ui">
    <text x="20" y="99" class="mono ink" font-size="27" font-weight="700">BRAIN</text>
